<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#f4f0e8">
  <title>もっち側にきいてみる</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="eyebrow">MOTCHI’s AI</div>
      <h1>もっちのAIと話してみる</h1>
      <p class="lead">
        洋輔さん側で共有されている情報をもとに答えます。<br>
        本人の発言とAIの見立ては、なるべく分けて扱います。
      </p>

      <div id="chat" class="chat" aria-live="polite">
        <div class="message ai">
          <div class="bubble">美砂さん、なんでも聞いてください。</div>
        </div>
      </div>

      <form id="askForm" class="composer">
        <textarea
          id="question"
          rows="3"
          maxlength="2000"
          placeholder="たとえば『洋輔さんって◯◯の時なんて言ってた？』"
        ></textarea>
        <div class="composer-foot">
          <span id="remaining" class="remaining">1日20回まで</span>
          <button id="sendButton" type="submit">送信する</button>
        </div>
      </form>

      <p class="notice">
        質問と回答は、洋輔さんが確認できる記録として保存されます。
      </p>
    </section>
  </main>

  <div id="login" class="login">
    <div class="login-box">
      <div class="bird">🐔</div>
      <h2>あいことば</h2>
      <p>最初だけいれてね。</p>
      <input
        id="passphrase"
        type="password"
        autocomplete="current-password"
        enterkeyhint="go"
      >
      <label class="remember">
        <input id="rememberPassphrase" type="checkbox" checked>
        この端末では覚えておく
      </label>
      <button id="loginButton" type="button">ひらく</button>
      <div id="loginError" class="error"></div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
